<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" width="1400" height="1040" font-family="'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="1400" height="1040" fill="#1b1f24"/>

  <!-- 제목 -->
  <text x="60" y="56" font-size="30" font-weight="800" fill="#e6edf3">Thursday 작업대 배치</text>
  <text x="440" y="56" font-size="19" fill="#8b949e">위에서 내려다본 모습 · 초안 (치수는 가정, #4 실측 후 12/01 확정)</text>

  <!-- 작업대 -->
  <rect x="60" y="110" width="1280" height="800" rx="22" fill="#262b33" stroke="#8b949e" stroke-width="2"/>
  <text x="80" y="140" font-size="16" fill="#8b949e">작업대 판 (단색, 약 60×45cm)</text>

  <!-- 웹캠 + 시야 -->
  <rect x="610" y="72" width="120" height="44" rx="10" fill="#3b4554" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="670" cy="94" r="12" fill="#58a6ff"/>
  <text x="745" y="100" font-size="18" font-weight="700" fill="#58a6ff">웹캠 (위에서 내려다봄)</text>

  <!-- 고정 조명 -->
  <circle cx="1290" cy="150" r="22" fill="#d4a72c" opacity="0.9"/>
  <text x="1170" y="157" font-size="16" fill="#e3b341">고정 조명</text>

  <!-- ===== 보관 구역 ===== -->
  <rect x="100" y="165" width="820" height="400" rx="14" fill="none" stroke="#6e7bff" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="120" y="195" font-size="20" font-weight="800" fill="#a5b4ff">보관 구역 (S) · 9칸</text>

  <!-- 먼 줄: 큰 칸 S7~S9 -->
  <g font-size="16">
    <rect x="125" y="210" width="230" height="100" rx="10" fill="#2f2620" stroke="#f0883e" stroke-width="2.5"/>
    <rect x="375" y="210" width="230" height="100" rx="10" fill="#2f2620" stroke="#f0883e" stroke-width="2.5"/>
    <rect x="625" y="210" width="230" height="100" rx="10" fill="#2f2620" stroke="#f0883e" stroke-width="2.5"/>
    <text x="137" y="234" font-weight="700" fill="#f0883e">S7 · 큰 칸</text>
    <text x="387" y="234" font-weight="700" fill="#f0883e">S8 · 큰 칸</text>
    <text x="637" y="234" font-weight="700" fill="#f0883e">S9 · 큰 칸</text>
    <!-- 예시 물건 -->
    <rect x="175" y="248" width="130" height="48" rx="6" fill="#e6edf3"/><text x="190" y="278" fill="#1b1f24" font-weight="700">브레드보드</text>
    <rect x="440" y="248" width="100" height="48" rx="6" fill="#30363d" stroke="#c9d1d9"/><text x="448" y="278" fill="#c9d1d9" font-weight="700">배터리 홀더</text>
    <rect x="690" y="252" width="100" height="40" rx="20" fill="#8957e5"/><text x="708" y="278" fill="#fff" font-weight="700">드라이버</text>
  </g>

  <!-- 중간 줄: 작은 칸 S4~S6 -->
  <g font-size="15">
    <rect x="125" y="335" width="150" height="95" rx="10" fill="#2b2a1f" stroke="#d29922" stroke-width="2.5"/>
    <rect x="295" y="335" width="150" height="95" rx="10" fill="#2b2a1f" stroke="#d29922" stroke-width="2.5"/>
    <rect x="465" y="335" width="150" height="95" rx="10" fill="#2b2a1f" stroke="#d29922" stroke-width="2.5"/>
    <text x="137" y="357" font-weight="700" fill="#d29922">S4</text>
    <text x="307" y="357" font-weight="700" fill="#d29922">S5</text>
    <text x="477" y="357" font-weight="700" fill="#d29922">S6</text>
    <rect x="178" y="368" width="48" height="48" rx="4" fill="#da3633"/><text x="236" y="398" fill="#c9d1d9">빨강</text>
    <rect x="348" y="368" width="48" height="48" rx="4" fill="#1f6feb"/><text x="406" y="398" fill="#c9d1d9">파랑</text>
    <rect x="518" y="368" width="48" height="48" rx="4" fill="#e3b341"/><text x="576" y="398" fill="#c9d1d9">노랑</text>
  </g>

  <!-- 가까운 줄: 작은 칸 S1~S3 -->
  <g font-size="15">
    <rect x="125" y="450" width="150" height="95" rx="10" fill="#1f2b22" stroke="#3fb950" stroke-width="2.5"/>
    <rect x="295" y="450" width="150" height="95" rx="10" fill="#1f2b22" stroke="#3fb950" stroke-width="2.5"/>
    <rect x="465" y="450" width="150" height="95" rx="10" fill="#1f2b22" stroke="#3fb950" stroke-width="2.5"/>
    <text x="137" y="472" font-weight="700" fill="#3fb950">S1</text>
    <text x="307" y="472" font-weight="700" fill="#3fb950">S2</text>
    <text x="477" y="472" font-weight="700" fill="#3fb950">S3</text>
    <rect x="168" y="482" width="64" height="48" rx="6" fill="#f0883e"/><text x="174" y="512" fill="#1b1f24" font-weight="700" font-size="13">저항</text>
    <rect x="338" y="482" width="64" height="48" rx="6" fill="#f85149"/><text x="346" y="512" fill="#fff" font-weight="700" font-size="13">LED</text>
    <rect x="508" y="482" width="64" height="48" rx="6" fill="#2ea043"/><text x="512" y="512" fill="#fff" font-weight="700" font-size="13">점퍼선</text>
  </g>

  <!-- 접근 비용 범례 -->
  <g font-size="15">
    <text x="650" y="352" font-weight="700" fill="#c9d1d9">꺼내기 비용</text>
    <rect x="650" y="364" width="18" height="18" rx="3" fill="none" stroke="#3fb950" stroke-width="2.5"/><text x="676" y="379" fill="#3fb950">가까운 줄 = 빠름</text>
    <rect x="650" y="390" width="18" height="18" rx="3" fill="none" stroke="#d29922" stroke-width="2.5"/><text x="676" y="405" fill="#d29922">중간 줄</text>
    <rect x="650" y="416" width="18" height="18" rx="3" fill="none" stroke="#f0883e" stroke-width="2.5"/><text x="676" y="431" fill="#f0883e">먼 줄 = 느림</text>
    <text x="650" y="465" fill="#8b949e">정리할 때 자주 쓰는 것·</text>
    <text x="650" y="487" fill="#8b949e">다음에 쓸 것을 가까운 줄로</text>
    <text x="650" y="509" fill="#8b949e">(D-02 정리 최적화)</text>
  </g>

  <!-- ===== 작업 구역 ===== -->
  <rect x="100" y="600" width="820" height="210" rx="14" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="120" y="630" font-size="20" font-weight="800" fill="#56d364">작업 구역 (W) · 4칸 — 준비 단계에서 꺼내 두는 곳</text>
  <g font-size="16" font-weight="700">
    <rect x="125" y="650" width="230" height="135" rx="10" fill="#22272e" stroke="#56d364" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="375" y="650" width="230" height="135" rx="10" fill="#22272e" stroke="#56d364" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="625" y="650" width="130" height="135" rx="10" fill="#22272e" stroke="#56d364" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="770" y="650" width="130" height="135" rx="10" fill="#22272e" stroke="#56d364" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="210" y="725" fill="#56d364">W1 · 큰 칸</text>
    <text x="460" y="725" fill="#56d364">W2 · 큰 칸</text>
    <text x="675" y="725" fill="#56d364">W3</text>
    <text x="820" y="725" fill="#56d364">W4</text>
  </g>

  <!-- ===== 로봇 ===== -->
  <rect x="1060" y="350" width="140" height="100" rx="16" fill="#3b4554" stroke="#c9d1d9" stroke-width="2"/>
  <line x1="1130" y1="400" x2="1010" y2="320" stroke="#8b98a9" stroke-width="22" stroke-linecap="round"/>
  <line x1="1010" y1="320" x2="900" y2="390" stroke="#8b98a9" stroke-width="18" stroke-linecap="round"/>
  <circle cx="1130" cy="400" r="20" fill="#d0d7de"/>
  <circle cx="1010" cy="320" r="16" fill="#d0d7de"/>
  <path d="M888 380 l-14 -8 m14 18 l-16 4" stroke="#d0d7de" stroke-width="5" stroke-linecap="round"/>
  <text x="1070" y="480" font-size="20" font-weight="800" fill="#e6edf3">SO-101 로봇팔</text>
  <text x="1048" y="504" font-size="14" fill="#8b949e">클램프로 고정 · 노트북에 USB</text>
  <text x="1030" y="526" font-size="14" fill="#8b949e">작업 반경은 #4에서 실측</text>

  <!-- ===== 전달 H · 반납 R ===== -->
  <rect x="955" y="600" width="365" height="210" rx="14" fill="none" stroke="#e3b341" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="975" y="630" font-size="18" font-weight="800" fill="#e3b341">사람과 주고받는 곳</text>
  <rect x="975" y="650" width="150" height="135" rx="12" fill="#2d2a1d" stroke="#e3b341" stroke-width="3"/>
  <text x="1012" y="700" font-size="24" font-weight="800" fill="#e3b341">전달 H</text>
  <text x="993" y="728" font-size="14" fill="#c9d1d9">"○○ 줘" →</text>
  <text x="993" y="750" font-size="14" fill="#c9d1d9">여기에 놓음</text>
  <rect x="1150" y="650" width="150" height="135" rx="12" fill="#2a1f2d" stroke="#d2a8ff" stroke-width="3"/>
  <text x="1185" y="700" font-size="24" font-weight="800" fill="#d2a8ff">반납 R</text>
  <text x="1166" y="728" font-size="14" fill="#c9d1d9">다 쓴 물건 →</text>
  <text x="1166" y="750" font-size="14" fill="#c9d1d9">로봇이 치움</text>

  <!-- 비상 정지 -->
  <circle cx="1285" cy="860" r="24" fill="#da3633" stroke="#ffa198" stroke-width="3"/>
  <text x="1110" y="868" font-size="16" font-weight="700" fill="#ff7b72">비상 정지 스위치 →</text>

  <!-- 사용자 -->
  <path d="M1140 935 L1140 915" stroke="#8b949e" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="1060" cy="965" r="16" fill="#c9d1d9"/>
  <rect x="1042" y="982" width="36" height="22" rx="10" fill="#c9d1d9"/>
  <text x="1092" y="978" font-size="20" font-weight="800" fill="#e6edf3">사용자 쪽</text>
  <text x="1092" y="1002" font-size="14" fill="#8b949e">로봇이 멈췄을 때만 작업 구역에 손</text>

  <!-- 노트북 -->
  <rect x="80" y="935" width="250" height="70" rx="12" fill="#1f2937" stroke="#1f6feb" stroke-width="2.5"/>
  <text x="102" y="967" font-size="19" font-weight="800" fill="#58a6ff">Intel 노트북 (두뇌)</text>
  <text x="102" y="992" font-size="14" fill="#8b949e">음성·인식·계획·로봇 제어</text>
  <text x="350" y="967" font-size="15" fill="#8b949e">USB: 로봇 · 웹캠 · 마이크</text>
  <text x="350" y="992" font-size="15" fill="#8b949e">인터넷 없이 동작 (Edge AI)</text>
</svg>
