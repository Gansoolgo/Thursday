<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>Thursday 작업대 배치도</title><desc>뒤쪽 좌우 로봇암 2대, 중앙 상부 카메라, 왼쪽 측면 카메라, 오른쪽 정리대, 가운데 공용 작업 공간, 앞쪽 사용자 의자. 실측 전 개념도.</desc>
<defs><linearGradient id="blue" x2="0" y2="1"><stop stop-color="#b7dcfa"/><stop offset="1" stop-color="#559dd2"/></linearGradient><g id="arm" stroke="#102747" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="-43" y="-39" width="86" height="78" rx="12" fill="url(#blue)"/><path d="M0 0 L-51 99" stroke-width="46"/><path d="M0 0 L-51 99" stroke="#62b1ea" stroke-width="35"/><path d="M-51 99 L-49 143" stroke-width="36"/><path d="M-51 99 L-49 143" stroke="#62b1ea" stroke-width="25"/><circle r="24" fill="url(#blue)"/><circle cx="-51" cy="99" r="24" fill="url(#blue)"/><path d="M-62 140 L-80 155 L-75 185 L-64 187 L-61 161 M-36 140 L-18 155 L-23 185 L-34 187 L-37 161" fill="#aabac8"/><rect x="-65" y="126" width="32" height="24" rx="9" fill="url(#blue)"/></g><g id="tray"><rect width="164" height="61" rx="15" fill="#fffaef" stroke="#85552a" stroke-width="4"/><rect x="10" y="10" width="144" height="41" rx="9" fill="#e7e0d6"/></g></defs>
